<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI导学系统</title>
<script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@0.27.2/dist/axios.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body {height:100%;background:#fff5f9;overflow:hidden;cursor:default;}
/* 整体三栏不等宽布局：左33% 中37% 右30% 修复网格撑开问题 */
.wrap {
  height:100vh;
  max-width:1750px;
  margin:0 auto;
  display:grid;
  grid-template-columns: 33% 37% 30%;
  gap:12px;
  padding:12px;
  font-family:"Microsoft Yahei",sans-serif;
}
.col-panel{
  height:100%;
  display:flex;
  flex-direction:column;
  gap:0;
  min-height:0;
  overflow:hidden;
}

/* 流光动画定义 */
@keyframes flowBorder {
  0% {background-position: 0% 50%;}
  100% {background-position: 200% 50%;}
}

/* ========== 左栏：知识图谱【完全原样，不加流光】 ========== */
.graph-wrap{
  width:100%;
  height:100%;
  border:2px solid #f8c8dc;
  padding:12px;
  display:flex;
  flex-direction:column;
  background:#fffafc;
  border-radius:16px;
  position:relative;
  overflow:hidden;
  transition: all 0.3s ease;
  transform: scale(1);
}
.graph-wrap:hover{
  transform: scale(1.015);
  border-color:#e09abc;
  box-shadow: 0 6px 18px rgba(232, 154, 188, 0.25);
}
.graph-wrap .deco{
  position:absolute;
  top:8px;
  right:12px;
  font-size:26px;
  opacity:0.55;
  pointer-events:none;
  z-index:2;
}
.graph-wrap h3{
  color:#d86b9e;
  font-size:17px;
  margin-bottom:8px;
}
#graph-box{
  flex:1;
  width:100%;
  background:#fff7fb;
  border-radius:16px;
  border:2px solid #f8d6e5;
  min-height:0;
  position:relative;
}
#graph-box.empty-tip{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:#b87898;
}
.tip-text{
  font-size:12px;
  color:#b87898;
  margin-top:6px
}

/* ========== 中间栏外层流光容器（强制有效结构） ========== */
.flow-outer{
  width:100%;
  height:100%;
  padding:3px;
  border-radius:18px;
  background: linear-gradient(90deg,#f8c8dc,#e078a6,#f8c8dc,#e078a6);
  background-size:200% 100%;
  animation: flowBorder 3s linear infinite;
}
.chat-wrap{
  width:100%;
  height:100%;
  background:#fffafc;
  border-radius:15px;
  padding:16px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  min-height:0;
  transition: all 0.3s ease;
  transform: scale(1);
}
.chat-wrap:hover{
  transform: scale(1.015);
  box-shadow: 0 6px 18px rgba(232, 154, 188, 0.25);
}
.chat-wrap .deco{
  position:absolute;
  top:8px;
  right:12px;
  font-size:26px;
  opacity:0.55;
  pointer-events:none;
  z-index:2;
}
.agent-tab{
  display:flex;
  gap:8px;
  margin-bottom:12px
}
.agent-tab button{
  padding:6px 14px;
  border:2px solid #f4b8d0;
  background:#fff;
  color:#d15b8c;
  border-radius:20px;
  cursor:pointer;
  transition:0.2s;
}
.agent-tab button.active{
  background:#f4b8d0;
  color:#fff;
  border-color:#e89abc;
}
.agent-tab button:hover{
  background:#ffe6ef;
}
.chat-box{
  flex:1;
  border:2px solid #f8d6e5;
  background:#fff7fb;
  border-radius:14px;
  padding:10px;
  overflow-y:auto;
  margin-bottom:12px;
  max-height: calc(100% - 80px);
  min-height:0;
}
.msg-item{
  margin:8px 0
}
.user-msg{
  text-align:right
}
.user-msg span{
  display:inline-block;
  background:#f4a8c7;
  color:#fff;
  padding:8px 12px;
  border-radius:18px 18px 4px 18px;
  max-width:80%;
  word-wrap:break-word;
  white-space:pre-line;
}
.ai-msg span{
  display:inline-block;
  background:#ffe6ef;
  color:#993e68;
  padding:8px 12px;
  border-radius:18px 18px 18px 4px;
  max-width:80%;
  word-wrap:break-word;
  white-space:pre-line;
}
.send-area{
  display:flex;
  gap:8px;
  position:relative;
}
.send-area .input-deco{
  position:absolute;
  right:70px;
  top:50%;
  transform:translateY(-50%);
  font-size:22px;
  opacity:0.5;
  pointer-events:none;
  z-index:2;
}
.send-area textarea{
  flex:1;
  padding:8px 12px;
  padding-right:40px;
  resize:none;
  border:2px solid #f4c8dd;
  border-radius:22px;
  background:#fff;
  outline:none;
}
.send-area textarea:focus{
  border-color:#e89abc;
}
.send-area button{
  padding:0 18px;
  background:#f4a8c7;
  color:#fff;
  border:none;
  border-radius:22px;
  cursor:pointer;
  transition:0.2s;
}
.send-area button:hover{
  background:#e88fb9;
}

/* ========== 右侧栏外层流光容器 ========== */
.quiz-outer{
  width:100%;
  height:100%;
  padding:3px;
  border-radius:18px;
  background: linear-gradient(90deg,#f8c8dc,#e078a6,#f8c8dc,#e078a6);
  background-size:200% 100%;
  animation: flowBorder 3s linear infinite;
}
.quiz-wrap{
  width:100%;
  height:100%;
  padding:16px;
  display:flex;
  flex-direction:column;
  background:#fffafc;
  border-radius:15px;
  position:relative;
  min-height:0;
  overflow:hidden;
  transition: all 0.3s ease;
  transform: scale(1);
}
.quiz-wrap:hover{
  transform: scale(1.015);
  box-shadow: 0 6px 18px rgba(232, 154, 188, 0.25);
}
.quiz-wrap .deco{
  position:absolute;
  top:8px;
  right:12px;
  font-size:26px;
  opacity:0.55;
  pointer-events:none;
  z-index:2;
}
.quiz-wrap h3{
  color:#d86b9e;
  margin-bottom:10px;
}
.quiz-box{
  border:2px solid #f8d6e5;
  background:#fff7fb;
  border-radius:14px;
  padding:12px;
  flex:1;
  overflow-y:auto;
  color:#773355;
  margin-bottom:12px;
  min-height:0;
}
.option-item {
  margin:8px 0;
  padding:6px 8px;
  background:#fff5f9;
  border-radius:10px;
  transition:0.2s;
}
.option-item:hover{
  background:#ffe6ef;
  padding-left:10px;
}
.answer-input-area {
  margin-top:15px;
  display:flex;
  gap:8px;
}
.answer-input-area input {
  flex:1;
  padding:7px 10px;
  border:2px solid #f4c8dd;
  border-radius:18px;
  outline:none;
  text-transform:uppercase;
}
.answer-input-area input:focus{
  border-color:#e89abc;
}
.answer-input-area button {
  padding:0 12px;
  background:#f4a8c7;
  color:#fff;
  border:none;
  border-radius:18px;
  cursor:pointer;
  transition:0.2s;
}
.answer-input-area button:hover{
  background:#e88fb9;
}
.start-quiz{
  width:100%;
  padding:9px;
  background:#f4a8c7;
  color:#fff;
  border:none;
  border-radius:22px;
  cursor:pointer;
  font-size:15px;
  transition:0.2s;
  margin-bottom:8px;
  flex-shrink:0;
}
.start-quiz:hover{
  background:#e88fb9;
}

/* 知识点弹窗 */
.detail-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  z-index:99;
  display:flex;
  align-items:center;
  justify-content:center;
}
.detail-box{
  width:580px;
  max-height:75vh;
  background:#fffafc;
  border:2px solid #f8c8dc;
  border-radius:18px;
  padding:20px;
  overflow-y:auto;
}
.detail-title{
  font-size:18px;
  color:#d15b8c;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.close-btn{
  width:28px;
  height:28px;
  border-radius:50%;
  border:none;
  background:#f4b8d0;
  color:white;
  cursor:pointer;
}
.detail-content{
  line-height:1.7;
  color:#663350;
  white-space:pre-line;
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <!-- 左栏：图谱 无任何修改、无流光 -->
  <div class="col-panel">
    <div class="graph-wrap">
      <span class="deco">🌧️</span>
      <h3>课程知识图谱</h3>
      <div id="graph-box">
        <div class="empty-tip" v-if="!graphData || graphData.nodes.length===0">图谱加载中/暂无数据</div>
      </div>
      <div class="tip-text">鼠标滚轮缩放 | 拖拽平移画布 | 点击节点快速定位知识点</div>
    </div>
  </div>

  <!-- 中间聊天：外层流光容器 -->
  <div class="col-panel">
    <div class="flow-outer">
      <div class="chat-wrap">
        <span class="deco">🔥</span>
        <div class="agent-tab">
          <button :class="{active:agentType==='math'}" @click="agentType='math';clearHistory()">数学推导Agent</button>
          <button :class="{active:agentType==='code'}" @click="agentType='code';clearHistory()">算法实现Agent</button>
          <button :class="{active:agentType==='concept'}" @click="agentType='concept';clearHistory()">概念辨析Agent</button>
        </div>
        <div class="chat-box" ref="chatScroll">
          <div v-for="(item,idx) in msgList" :key="idx" class="msg-item" :class="item.role==='user'?'user-msg':'ai-msg'">
            <span>{{ formatText(item.content) }}</span>
          </div>
        </div>
        <div class="send-area">
          <span class="input-deco">🦔</span>
          <textarea v-model="inputText" placeholder="输入你的问题..."></textarea>
          <button @click="sendMsg">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 右侧刷题：外层流光容器 + 图标改为✨ -->
  <div class="col-panel">
    <div class="quiz-outer">
      <div class="quiz-wrap">
        <span class="deco">✨</span>
        <h3>知识点测验 🎀</h3>
        <div class="quiz-box">
          <div v-if="quizContent">
            <p style="margin-bottom:10px">{{formatText(quizContent)}}</p>
            <div v-for="(opt,i) in quizOptions" :key="i" class="option-item">
              {{String.fromCharCode(65+i)}}. {{formatText(opt)}}
            </div>
            <div class="answer-input-area">
              <input v-model="userAnswer" placeholder="填写你的答案（A/B/C/D）">
              <button @click="submitAnswer">提交答案</button>
            </div>
          </div>
          <div v-else style="color:#c988a5;">点击下方按钮获取题目</div>
        </div>
        <button class="start-quiz" @click="getQuiz">开始刷题</button>
      </div>
    </div>
  </div>

  <!-- 知识点弹窗 -->
  <div v-if="showDetail" class="detail-mask" @click.self="closeDetail">
    <div class="detail-box">
      <div class="detail-title">
        <span>🌸 {{detailNode.name}}</span>
        <button class="close-btn" @click="closeDetail">×</button>
      </div>
      <div class="detail-content">{{ formatText(detailNode.content) }}</div>
    </div>
  </div>
</div>
<script>
new Vue({
el:'#app',
data(){
return{
agentType:'concept',
inputText:'',
msgList:[],
// 新增对话上下文数组，存储历史轮次
chatHistory:[],
quizContent:'',
quizOptions:[],
userAnswer:'',
currentQuizId:'',
chart:null,
graphData:null,
showDetail:false,
detailNode:{name:'',content:''}
}
},
mounted(){
this.initGraph();
this.loadKnowledgeData();
},
methods:{
// 切换Agent自动清空上下文，避免不同类型对话串内容
clearHistory(){
  this.chatHistory = [];
},
// 强化版文本清洗：清除所有*列表标记、加粗符号、标题标记，规整换行
formatText(raw){
  if(!raw) return '';
  let txt = raw
    .replace(/\*\*/g, '') // 清除加粗标记
    .replace(/^(\s*)\*\s*/gm, '$1') // 清除行首列表*
    .replace(/\s*\*(\s*)/g, '$1') // 清除行内零散*
    .replace(/^#{1,3}\s*/gm, '') // 清除markdown标题#
    .replace(/\n\s*\n+/g, '\n\n'); // 合并多余空行
  return txt;
},
initGraph(){
this.chart=echarts.init(document.getElementById('graph-box'));
this.chart.on('click', (params)=>{
  const nodeData = params.data;
  this.inputText = `请讲解 ${params.name} 相关知识点`;
  if(nodeData.content){
    this.detailNode = {
      name: nodeData.name,
      content: nodeData.content
    }
    this.showDetail = true;
  }
});
window.addEventListener('resize',()=>{
  this.chart.resize();
  this.autoFitGraph();
});
},
// 图谱自动适配缩放，完整容纳所有节点
autoFitGraph(){
  const chart = this.chart;
  chart.resize();
},
loadKnowledgeData(){
const vm = this;
axios.get('http://localhost:5000/api/knowledge_graph')
.then(res=>{
  const data=res.data.data;
  vm.graphData = data;
  const nodes=data.nodes;
  const edges=data.edges;
  const renderNodes = nodes.map(item=>{
    const hasContent = !!item.content;
    let nodeStyle;
    if(hasContent){
      nodeStyle = {
        color:{
          type:'radial',
          x:0.5,y:0.5,r:0.8,
          colorStops:[
            {offset:0,color:'#f8b8d0'},
            {offset:1,color:'#d1689c'}
          ]
        }
      }
    }else{
      nodeStyle = {color:'#cccccc'}
    }
    return {
      id:item.id,
      name:item.name,
      content: item.content || '',
      symbolSize:70,
      symbol:'circle',
      itemStyle: nodeStyle,
      label:{
        show:true,
        color: hasContent ? '#fff' : '#666',
        fontSize:12
      }
    }
  });
  const option={
    tooltip:{
      trigger:'item',
      backgroundColor:'#fff7fb',
      textStyle:{color:'#993e68'},
      formatter:function(params){
        const node = params.data;
        let tipText = `<b>${node.name}</b>`;
        if(node.content){
          const brief = vm.formatText(node.content).substring(0,50)+'...';
          tipText += `<br>${brief}`
        }else{
          tipText += '<br>暂无详细资料'
        }
        return tipText;
      }
    },
    series:[{
      type:'graph',
      layout:'force',
      data:renderNodes,
      links:edges,
      roam:true,
      zoom:1,
      scaleLimit:{
        min:0.25,
        max:2.5
      },
      label:{show:true},
      force:{
        repulsion:1400,
        edgeLength:160,
        layoutAnimation:false,
        initLayout:'vertical'
      },
      lineStyle:{
        color:'#f4b8d0',
        width:2
      },
      // 节点hover放大加深特效，只追加配置，原有布局完全不动
      emphasis:{
        focus:'adjacency',
        scale:1.25,
        itemStyle:{
          shadowBlur:15,
          shadowColor:'#e88fb9'
        },
        lineStyle:{
          width:3,
          color:'#e078a6'
        }
      }
    }]
  };
  vm.chart.setOption(option);
  // 渲染完成自动适配缩放，整张图完整放入容器
  setTimeout(()=>{
    vm.autoFitGraph();
  }, 350);
})
.catch(err=>{
  console.error("图谱接口请求异常",err);
  vm.graphData = {nodes:[],edges:[]};
});
},
closeDetail(){
  this.showDetail = false;
  this.detailNode = {name:'',content:''};
},
sendMsg(){
const q=this.inputText.trim();
if(!q) return;
// 1、存入聊天展示列表
this.msgList.push({role:'user',content:q});
// 2、存入上下文历史数组，给后端携带记忆
this.chatHistory.push({
  role:"user",
  content:q
});
const vm = this;
this.$nextTick(()=>this.$refs.chatScroll.scrollTop=this.$refs.chatScroll.scrollHeight);
axios.post('http://localhost:5000/api/chat',
{
  question:q,
  agent_type:this.agentType,
  history:this.chatHistory
},{headers:{'Content-Type':'application/json'}})
.then(res=>{
let ans = res.data.answer || res.data.reply || JSON.stringify(res.data);
// 存入展示列表
vm.msgList.push({role:'assistant',content:ans});
// AI回复也存入上下文，形成完整对话链
vm.chatHistory.push({
  role:"assistant",
  content:ans
});
vm.$nextTick(()=>vm.$refs.chatScroll.scrollTop=vm.$refs.chatScroll.scrollHeight);
})
.catch(()=>vm.msgList.push({role:'assistant',content:'请求异常，后端未响应'}));
this.inputText='';
},
getQuiz(){
axios.post('http://localhost:5000/api/quiz/get', null, {
headers: {
'Content-Type': 'application/json'
}
})
.then(res=>{
this.quizContent = res.data.question;
this.quizOptions = res.data.options || [];
this.currentQuizId = res.data.id || '';
this.userAnswer = '';
})
.catch(err=>{
this.quizContent = '题目获取失败';
this.quizOptions = [];
});
},
submitAnswer(){
const userSel = this.userAnswer.trim().toUpperCase();
if(!['A','B','C','D'].includes(userSel)){
  alert("请仅填写A/B/C/D其中一个字母！");
  return;
}
axios.post('http://localhost:5000/api/quiz/submit',{
  user_answer: userSel,
  question_id: this.currentQuizId
},{headers:{'Content-Type':'application/json'}})
.then(res=>{
  const ret = res.data.data;
  let correctLetter = '';
  this.quizOptions.forEach((opt,idx)=>{
    if(opt === ret.correct_answer){
      correctLetter = String.fromCharCode(65+idx);
    }
  })
  const isRightLocal = (userSel === correctLetter);
  if(isRightLocal){
    alert(`回答正确！\n✅正确答案：${correctLetter}\n解析：${this.formatText(ret.explanation)}`);
  }else{
    alert(`回答错误\n❌正确答案：${correctLetter}\n解析：${this.formatText(ret.explanation)}`);
  }
  this.userAnswer = '';
  this.quizContent = '';
  this.quizOptions = [];
})
.catch(err=>{
  alert("提交失败："+err);
})
}
}
})
</script>
</body>
</html>
